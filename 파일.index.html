  <script src="/_sdk/489148d8756906ef.editing_sdk.js" integrity="sha512-hxxSbMNp1t+UEu3j/dIQUU4MJnmsCo0Gs3iQVVS706vrCJ3Yt2+ySOlfJEaPyiyQVLjZRmn1dNVqg6M40VZZHQ=="></script>
  <script>
    const levelRates = { 1: 0.3, 2: 0.5, 3: 0.7 };
    const grammarWords = new Set([
      "a", "an", "the", "in", "on", "at", "by", "for", "from", "of", "with", "about",
      "into", "through", "during", "before", "after", "between", "among", "under",
      "over", "above", "below", "near", "behind", "beside", "within", "without",
      "to", "who", "whom", "whose", "which", "that", "where", "when", "why",
      "is", "are", "was", "were", "has", "have", "had", "does", "do", "did"
    ]);

    let selectedLevel = 0;
    let currentAnswers = [];
    let sourceText = "";

    const sourceInput = document.getElementById("source-text");
    const quizContent = document.getElementById("quiz-content");
    const quizView = document.getElementById("quiz-view");
    const emptyView = document.getElementById("empty-view");
    const inputMessage = document.getElementById("input-message");
    const resultMessage = document.getElementById("result-message");
    const progressPill = document.getElementById("progress-pill");
    const levelStatus = document.getElementById("level-status");

    function normalizeWord(value) {
      return value.toLowerCase().replace(/[^a-z']/g, "");
    }

    function getWordTokens(text) {
      const tokens = text.match(/[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g) || [];
      return tokens.map((value, index) => ({
        value,
        index,
        isWord: /^[A-Za-z]+(?:'[A-Za-z]+)?$/.test(value)
      }));
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function isGrammarCandidate(token, tokens) {
      const word = normalizeWord(token.value);
      if (grammarWords.has(word)) return true;

      if (word.endsWith("s") && word.length > 2 && !word.endsWith("ss")) return true;

      const previous = tokens[token.index - 1];
      if (previous && normalizeWord(previous.value) === "to") return true;

      return false;
    }

    function chooseBlankIndices(tokens, level) {
      const wordCandidates = tokens
        .filter(token => token.isWord && normalizeWord(token.value).length > 1)
        .map(token => token.index);

      if (level === 0) {
        const grammarCandidates = tokens
          .filter(token => token.isWord && isGrammarCandidate(token, tokens))
          .map(token => token.index);

        const chosen = grammarCandidates.length
          ? grammarCandidates
          : shuffle(wordCandidates).slice(0, Math.max(1, Math.min(3, wordCandidates.length)));

        return new Set(chosen);
      }

      const count = Math.max(1, Math.round(wordCandidates.length * levelRates[level]));
      return new Set(shuffle(wordCandidates).slice(0, count));
    }

    function validateInput(input, shouldNudge) {
      const answer = currentAnswers[Number(input.dataset.answerIndex)];
      const typedValue = normalizeWord(input.value);

      input.classList.remove("is-correct", "is-wrong");

      if (!typedValue) return false;

      const isCorrect = typedValue === answer.normalized;
      input.classList.add(isCorrect ? "is-correct" : "is-wrong");

      if (shouldNudge && !isCorrect) {
        input.classList.remove("is-wrong");
        void input.offsetWidth;
        input.classList.add("is-wrong");
      }

      return isCorrect;
    }

    function updateResultMessage() {
      const inputs = [...quizContent.querySelectorAll(".blank-input")];
      const correctCount = inputs.filter(input => validateInput(input, false)).length;

      if (correctCount === inputs.length && inputs.length) {
        resultMessage.textContent = `완벽해요! ${correctCount}개 빈칸을 모두 맞혔습니다.`;
      } else {
        resultMessage.textContent = `${inputs.length}개 중 ${correctCount}개 정답입니다. 빨간 빈칸을 다시 채워 보세요.`;
      }
    }

    function moveToNextBlank(currentInput) {
      const inputs = [...quizContent.querySelectorAll(".blank-input")];
      const currentIndex = inputs.indexOf(currentInput);
      const nextInput = inputs[currentIndex + 1];

      if (nextInput) {
        nextInput.focus();
        nextInput.select();
      } else {
        updateResultMessage();
      }
    }

    function renderQuiz() {
      const tokens = getWordTokens(sourceText);
      const blankIndices = chooseBlankIndices(tokens, selectedLevel);
      currentAnswers = [];

      const fragment = document.createDocumentFragment();

      tokens.forEach(token => {
        if (!blankIndices.has(token.index)) {
          fragment.appendChild(document.createTextNode(token.value));
          return;
        }

        const answerIndex = currentAnswers.length;
        currentAnswers.push({
          answer: token.value,
          normalized: normalizeWord(token.value)
        });

        const input = document.createElement("input");
        input.type = "text";
        input.className = "blank-input";
        input.autocomplete = "off";
        input.autocapitalize = "off";
        input.spellcheck = false;
        input.setAttribute("aria-label", `${answerIndex + 1}번째 빈칸`);
        input.dataset.answerIndex = String(answerIndex);
        input.style.width = `${Math.min(Math.max(token.value.length + 1, 5), 12)}ch`;

        input.addEventListener("input", () => {
          validateInput(input, false);
          resultMessage.textContent = "";
        });

        input.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
            validateInput(input, true);
            moveToNextBlank(input);
          }
        });

        fragment.appendChild(input);
      });

      quizContent.replaceChildren(fragment);
      progressPill.textContent = `빈칸 ${currentAnswers.length}개`;
      resultMessage.textContent = "";
      quizView.classList.remove("hidden-view");
      quizView.classList.add("reveal");
      emptyView.classList.add("hidden-view");

      const firstBlank = quizContent.querySelector(".blank-input");
      if (firstBlank) firstBlank.focus();
    }

    function generateQuiz() {
      const enteredText = sourceInput.value.trim();
      const wordCount = (enteredText.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || []).length;

      if (!enteredText) {
        inputMessage.textContent = "영어 본문을 먼저 입력해 주세요.";
        sourceInput.focus();
        return;
      }

      if (wordCount < 3) {
        inputMessage.textContent = "빈칸 문제를 만들 수 있도록 영어 단어를 3개 이상 입력해 주세요.";
        sourceInput.focus();
        return;
      }

      sourceText = enteredText;
      inputMessage.textContent = "";
      renderQuiz();
    }

    function selectLevel(level) {
      selectedLevel = level;

      [0, 1, 2, 3].forEach(item => {
        const button = document.getElementById(`level-${item}`);
        const isActive = item === level;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      levelStatus.textContent = `${level}단계 선택됨`;

      if (sourceText) renderQuiz();
    }

    function checkAnswers() {
      const inputs = [...quizContent.querySelectorAll(".blank-input")];
      if (!inputs.length) return;

      inputs.forEach(input => validateInput(input, true));
      updateResultMessage();

      const firstWrong = inputs.find(input => !input.classList.contains("is-correct"));
      if (firstWrong) firstWrong.focus();
    }

    document.getElementById("generate-button").addEventListener("click", generateQuiz);
    document.getElementById("check-button").addEventListener("click", checkAnswers);
    document.getElementById("reset-button").addEventListener("click", () => {
      if (sourceText) renderQuiz();
    });

    [0, 1, 2, 3].forEach(level => {
      document.getElementById(`level-${level}`).addEventListener("click", () => selectLevel(level));
    });

    sourceInput.addEventListener("input", () => {
      inputMessage.textContent = "";
    });

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
